<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f4f1ec}
    a{color:#17150f}
    a:hover{opacity:0.65}
    @keyframes gw-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    ::selection{background:#17150f;color:#f4f1ec}
  </style>
</helmet>
<div style="background:#f4f1ec;color:#17150f;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;overflow-x:hidden">

  <header style="position:sticky;top:0;z-index:40;background:rgba(244,241,236,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(23,21,15,0.12)">
    <div style="max-width:1400px;margin:0 auto;padding:22px 48px;display:flex;align-items:center;justify-content:space-between;gap:40px">
      <a href="index.html" style="font-family:'Newsreader',serif;font-size:22px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex-shrink:0">Kiki Angkratok</a>
      <nav style="display:flex;align-items:center;gap:22px;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;flex-wrap:wrap;justify-content:flex-end">
        <a href="works.html#shop" style="text-decoration:none;white-space:nowrap">Works</a>
        <a href="artist.html" style="text-decoration:none;white-space:nowrap">The Artist</a>
        <a href="whats-next.html" style="text-decoration:none;white-space:nowrap">What's Next</a>
      </nav>
    </div>
  </header>

  <section style="animation:gw-fade 0.8s ease both">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(23,21,15,0.12);border-bottom:1px solid rgba(23,21,15,0.12)">
      <sc-for list="{{ hero }}" as="h" hint-placeholder-count="3">
        <a href="{{ h.href }}" style="display:block;position:relative;aspect-ratio:1/1;overflow:hidden;background:#e7e3da">
          <div style="{{ h.imgStyle }}"></div>
        </a>
      </sc-for>
    </div>
    <div style="max-width:1400px;margin:0 auto;padding:56px 48px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 48px">
      <h1 style="font-family:'Newsreader',serif;font-weight:300;font-size:88px;line-height:0.95;letter-spacing:-0.03em">Kiki Angkratok</h1>
      <p style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#6b665c;padding-bottom:12px">Mixed-media portraiture · Memphis, Tennessee</p>
    </div>
  </section>

  <section style="max-width:1400px;margin:0 auto;padding:110px 48px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:1px solid rgba(23,21,15,0.2);padding-bottom:16px;margin-bottom:32px">
      <h2 style="font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#8a8377;font-weight:500">Selected works</h2>
      <a href="works.html#shop" style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none">View all work →</a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:48px 32px">
      <sc-for list="{{ selected }}" as="w" hint-placeholder-count="3">
        <a href="{{ w.href }}" style="display:flex;flex-direction:column;gap:16px;text-decoration:none">
          <div style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#e7e3da">
            <div style="{{ w.imgStyle }}"></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px">
              <h3 style="font-family:'Newsreader',serif;font-size:22px;font-style:italic;font-weight:400">{{ w.name }}</h3>
              <span style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8377;white-space:nowrap">{{ w.statusLabel }}</span>
            </div>
            <p style="font-size:12px;letter-spacing:0.05em;color:#8a8377">{{ w.spec }}</p>
          </div>
        </a>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:center;padding:80px 0 120px">
      <a href="works.html#shop" style="display:inline-block;border:1px solid #17150f;border-radius:999px;padding:15px 34px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:all 0.15s" style-hover="background:#17150f;color:#f4f1ec;opacity:1">View all work</a>
    </div>
  </section>

  <footer style="background:#17150f;color:#cfc9bd;padding:38px 48px">
    <div style="max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;font-size:13px;letter-spacing:0.06em">
      <span>Memphis, Tennessee</span>
      <a href="mailto:hello@kikiangkratok.art" style="color:#cfc9bd;text-decoration:none">hello@kikiangkratok.art</a>
      <a href="https://www.instagram.com/kiki_angkratok_art?igsh=YWJ2Z2NtOHJhNzFo" target="_blank" rel="noopener" style="color:#cfc9bd;text-decoration:none">@kiki_angkratok_art</a>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  PIECES = {
    belonging: { name: "Belonging",        spec: "Mixed media · details to come", sold: false, img: "belonging.jpg" },
    affection: { name: "Affection",        spec: "Mixed media · details to come", sold: false, img: "affection.jpg" },
    twofaces: { name: "Two Faces",         spec: "Mixed media on canvas · 24 × 30 in · 2026", sold: false, img: "1TheqTqNtPt1I9HKsqd-HdUQ3f-BuKy8a.jpg" },
    cry:      { name: "Cry",               spec: "Mixed media on canvas · 30 × 36 in · 2026", sold: false, img: "18uPfNdvOsDPWQKwQWkTkp1mlGoFfU0nv.jpg" },
    green:    { name: "Portrait in Green", spec: "Mixed media on canvas · 18 × 24 in · 2026", sold: false, img: "1zfNfFAwUXXSHFfko6RJRqpG7MWWn23cm.jpg" },
    kin:      { name: "Kin",               spec: "Mixed media on canvas · 30 × 40 in · 2026", sold: false, img: "1ITSWIgzMbpTI2Hdp5y8opTMfioE9lJP-.jpg" },
    woven:    { name: "Woven",             spec: "Mixed media on canvas · 20 × 24 in · 2025", sold: false, img: "1KgdemlPu6Gua3D7fNJX67iQT6-zCNp3u.jpg" },
    joy:      { name: "Joy",               spec: "Mixed media on canvas · 24 × 36 in · 2026", sold: false, img: "1C97zi_NAjSS_v8b4TkcFc84-3YcSHIts.jpg" },
  };

  item(id) {
    const p = this.PIECES[id];
    return {
      name: p.name,
      spec: p.spec,
      href: `piece.html#${id}`,
      statusLabel: p.sold ? "Collected" : "Available",
      imgStyle: `position:absolute;inset:0;background-image:url('${p.img}');background-size:cover;background-position:center`,
    };
  }

  renderVals() {
    const heroIds = this.props.heroIds ?? ["belonging", "affection", "twofaces"];
    const selectedIds = this.props.selectedIds ?? ["green", "woven", "joy"];
    return {
      hero: heroIds.map(id => this.item(id)),
      selected: selectedIds.map(id => this.item(id)),
    };
  }
}
</script>
</body>
</html>
